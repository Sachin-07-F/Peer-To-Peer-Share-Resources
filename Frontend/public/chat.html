  <div id="chat">
      <div class="chat-header-bg" style="display: flex; align-items: center; gap: 12px; margin-bottom: 0; position: relative; padding: 18px 24px 18px 24px; border-radius: 16px 16px 0 0; overflow: hidden;">
        <div style="position: absolute; inset: 0; z-index: 0; background: url('https://www.transparenttextures.com/patterns/geometry2.png'), linear-gradient(120deg, #e0e7ef 60%, #f5fafd 100%); opacity: 0.25;"></div>

      </div>
    <hr style="border: none; border-top: 1.5px solid #e0e4ea; margin: 12px 0 18px 0;">
    <div id="messages"></div>
    <form id="msgForm" autocomplete="off">
      <div id="inputArea">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn" type="submit"><i class="fa fa-paper-plane"></i> Send</button>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // Get logged-in user from localStorage
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) {
      alert('Please login to use chat.');
      window.location.href = 'login.html';
    }
    const myId = user.id;
    let adminId = null;

    // Fetch admin user from backend
    fetch(`${window.__env.API_BASE}/api/admin-user`)
      .then(res => res.json())
      .then(admin => {
        if (!admin || !admin._id) {
          alert('No admin found.');
          return;
        }
        adminId = admin._id;
        startChat();
      });

    function startChat() {
      const socket = io(`${window.__env.API_BASE}`);
      socket.emit('join', myId); // Only join the user's own room

      const messagesDiv = document.getElementById('messages');
      const msgInput = document.getElementById('msgInput');
      const sendBtn = document.getElementById('sendBtn');
      const msgForm = document.getElementById('msgForm');

      // Mark all admin messages as seen by user

      // Fetch previous messages
      fetch(`${window.__env.API_BASE}/api/chat/${myId}/${adminId}`)
        .then(res => res.json())
        .then(messages => {
          messages.forEach(msg => appendMsg(msg));
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

      // Send message on form submit
      msgForm.onsubmit = function(e) {
        e.preventDefault();
        sendMessage();
      };

      function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        socket.emit('chatMessage', { senderId: myId, receiverId: adminId, message: text });
        msgInput.value = '';
      }

      socket.on('chatMessage', msg => {
        const existing = Array.from(messagesDiv.children).some(div => {
          return div.dataset && div.dataset.ts === String(new Date(msg.timestamp).getTime()) && div.dataset.sender === msg.senderId;
        });
        if (existing) return;
        if (
          (msg.senderId === myId && msg.receiverId === adminId) ||
          (msg.senderId === adminId && msg.receiverId === myId)
        ) {
          appendMsg(msg);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          // Only mark as seen if the page is visible and the message is from admin
          if (msg.senderId === adminId && msg.receiverId === myId && document.visibilityState === 'visible') {
            markAdminMessagesSeenIfVisible();
          }
        }
      });
      // Listen for real-time blue tick update when admin sees messages
      socket.on('messagesSeenByAdmin', ({ adminId: seenAdminId }) => {
        if (seenAdminId === adminId) {
          fetch(`${window.__env.API_BASE}/api/chat/${myId}/${adminId}`)
            .then(res => res.json())
            .then(messages => {
              messagesDiv.innerHTML = '';
              messages.forEach(msg => appendMsg(msg));
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }
      });

      function appendMsg(msg) {
        const div = document.createElement('div');
        const isMe = msg.senderId === myId;
        let ticks = '';
        if (isMe) {
          if (msg.seenByAdmin) {
            ticks = '<span style="color:#2196f3;margin-left:6px;" title="Seen">&#10003;&#10003;</span>';
          } else if (msg.deliveredToReceiver) {
            ticks = '<span style="color:#888;margin-left:6px;" title="Delivered">&#10003;&#10003;</span>';
          } else {
            ticks = '<span style="color:#888;margin-left:6px;" title="Sent">&#10003;</span>';
          }
        }
        div.className = 'msg ' + (isMe ? 'me' : 'other');
        div.innerHTML = `
          <div class="bubble">${msg.message}</div>
          <div class="timestamp">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} ${ticks}</div>
        `;
        div.dataset.ts = String(new Date(msg.timestamp).getTime());
        div.dataset.sender = msg.senderId;
        messagesDiv.appendChild(div);
      }
    }

    function markAdminMessagesSeenIfVisible() {
      if (document.visibilityState === 'visible') {
        fetch(`${window.__env.API_BASE}/api/mark-admin-seen/${adminId}/${myId}`, { method: 'PATCH' });
      }
    }

    // When the page loads
    document.addEventListener('DOMContentLoaded', () => {
      markAdminMessagesSeenIfVisible();
    });

    // When the page/tab becomes visible
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        markAdminMessagesSeenIfVisible();
      }
    });

    let adminOnline = false;
    let adminLastSeen = null;

    function timeAgo(date) {
      if (!date) return '';
      const now = new Date();
      const diff = Math.floor((now - new Date(date)) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff/60) + ' min ago';
      if (diff < 86400) return Math.floor(diff/3600) + ' hr ago';
      return Math.floor(diff/86400) + ' days ago';
    }

    function updateAdminStatusUI() {
      const statusDiv = document.getElementById('adminStatus');
      if (!statusDiv) return;
      if (adminOnline) {
        statusDiv.textContent = 'Online';
        statusDiv.className = 'admin-status-badge online';
      } else if (adminLastSeen) {
        statusDiv.textContent = 'Last seen ' + timeAgo(adminLastSeen);
        statusDiv.className = 'admin-status-badge offline';
      } else {
        statusDiv.textContent = 'Offline';
        statusDiv.className = 'admin-status-badge offline';
      }
    }

    function fetchAdminStatus() {
      if (!adminId) return;
      fetch(`${window.__env.API_BASE}/api/user-status/${adminId}`)
        .then(res => res.json())
        .then(data => {
          adminOnline = data.online;
          adminLastSeen = data.lastSeen;
          updateAdminStatusUI();
        });
    }

    // Listen for admin's online status
    let socketForStatus = null;
    function setupAdminStatusSocket() {
      if (socketForStatus) return;
      socketForStatus = io(`${window.__env.API_BASE}`);
      socketForStatus.emit('join', myId); // Join as user
      socketForStatus.on('userOnlineStatus', ({ userId, isOnline }) => {
        if (userId === adminId) {
          adminOnline = isOnline;
          if (!isOnline) {
            fetchAdminStatus();
          } else {
            updateAdminStatusUI();
          }
        }
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      setupAdminStatusSocket();
      // Fetch admin status on page load
      setTimeout(fetchAdminStatus, 500); // Wait for adminId to be set
    });






    // Dark mode toggle functionality
document.addEventListener('DOMContentLoaded', function() {
  const darkModeToggle = document.getElementById('darkModeToggle');
  const darkModeIcon = darkModeToggle.querySelector('i');
  
  // Check for saved user preference
  const isDarkMode = localStorage.getItem('darkMode') === 'true';
  
  // Apply dark mode if enabled
  if (isDarkMode) {
    document.body.classList.add('dark-mode');
    darkModeIcon.classList.replace('fa-moon', 'fa-sun');
  }
  
  // Toggle dark mode on button click
  darkModeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    
    // Update icon
    if (isDark) {
      darkModeIcon.classList.replace('fa-moon', 'fa-sun');
    } else {
      darkModeIcon.classList.replace('fa-sun', 'fa-moon');
    }
    
    // Save preference
    localStorage.setItem('darkMode', isDark);
  });
});
  </script>

        if (user && user.name) {
          navItem.innerHTML = `

              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="${user.role === 'admin' ? 'admin-dashboard.html' : 'student-dashboard.html'}">Dashboard</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#" id="logoutDropdownBtn">Logout</a></li>
              </ul>
            </div>
          `;
          setTimeout(() => {
            const logoutBtn = document.getElementById('logoutDropdownBtn');
            if (logoutBtn) {
              logoutBtn.onclick = function(e) {
                e.preventDefault();
                localStorage.removeItem('user');
                location.reload();
              };
            }
          }, 100);
        } else {
          navItem.innerHTML = `
            <a class="btn btn-outline-light me-2" href="login.html">Login</a>
            <a class="btn btn-primary" href="login.html#student-signup">Sign Up</a>
          `;
        }
      }
      updateNavbarAuth();
    });
